<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/app.css" />
    {{hoist "head"}}
  </head>

  <body>
    <div class="flash-stack" aria-live="polite">
      {{range flashes}}
      <div class="flash flash-{{.Kind}}" role="status">{{.Text}}</div>
      {{end}}
    </div>
    {{slot "content"}}
    <script>
      document.querySelectorAll(".flash").forEach((toast) => {
        window.setTimeout(() => {
          toast.remove();
        }, 3780);
      });
    </script>
  </body>
</html>
